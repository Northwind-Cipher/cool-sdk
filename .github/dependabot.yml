version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      noble:
        patterns: ["@noble/*"]
    ignore:
      # Major bumps of crypto/serialisation deps are reviewed by hand.
      # @noble/* is pre-1.0, so a minor bump can be breaking too — ignore both.
      - dependency-name: "@noble/*"
        update-types:
          - "version-update:semver-major"
          - "version-update:semver-minor"
      - dependency-name: "cbor2"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
