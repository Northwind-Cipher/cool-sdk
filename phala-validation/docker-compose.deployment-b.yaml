# WORKLOAD-CHANGE IMAGE (Deployment B, WORKLOAD_MARKER=v2). Used only for the measurement-change test.
services:
  app:
    image: pranauvshrinaath/cool-phala-validation:final-b
    ports:
      - "8080:8080"
    volumes:
      - /var/run/dstack.sock:/var/run/dstack.sock
    environment:
      - COOL_DSTACK_ENDPOINT=/var/run/dstack.sock
      - COOL_IMAGE_DIGEST=sha256:1372fbe7ab61418519772146e59765a042c16a5d3f0080c1356e1cff4875ebca
      - WORKLOAD_MARKER=v2
      - PORT=8080
      - NO_COLOR=1
    restart: unless-stopped
