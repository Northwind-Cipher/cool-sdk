[package]
name = "cool-nsm-helper"
version = "1.0.0"
edition = "2021"
license = "Apache-2.0"
description = "Inside a Nitro Enclave: ask /dev/nsm for an attestation document (the helper CooL's CommandNsmSource calls)."
publish = false

[dependencies]
aws-nitro-enclaves-nsm-api = "=0.5.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_bytes = "0.11"
base64 = "0.22"

[profile.release]
lto = true
strip = true
