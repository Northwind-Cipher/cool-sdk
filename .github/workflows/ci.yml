name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Unit + adversarial tests
        run: npm test
      - name: Build
        run: npm run build
      - name: Demo (valid -> tamper -> fail)
        run: npm run demo
        env:
          NO_COLOR: "1"

  consumer:
    name: consumer install check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      # Packs the tarball, installs it into a clean project, records + verifies
      # evidence, and typechecks a consumer under nodenext AND bundler.
      - run: npm run verify:package

  examples:
    name: examples run
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: basic
        run: cd examples/basic && npm install --no-audit --no-fund && node index.mjs
      - name: verification
        run: cd examples/verification && npm install --no-audit --no-fund && node index.mjs
      - name: agent
        run: cd examples/agent && npm install --no-audit --no-fund && node index.mjs

  redis:
    name: shared replay store (real Redis)
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: RedisNonceStore against a real server (two connections racing)
        run: node --import tsx --test tests/replay-shared.test.ts
        env:
          COOL_TEST_REDIS_URL: redis://127.0.0.1:6379

  nitro-image:
    name: nitro enclave image (NSM helper compiles)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci && npm run build
      - name: Pack this commit into the enclave build context
        run: npm pack --pack-destination examples/nitro-enclave && mv examples/nitro-enclave/cool-nwc-*.tgz examples/nitro-enclave/cool-nwc.tgz
      - name: docker build (compiles cool-nsm-helper against aws-nitro-enclaves-nsm-api)
        run: docker build -t cool-enclave:ci examples/nitro-enclave
      - name: Outside an enclave the helper fails loudly, never with a document
        run: |
          set +e
          out=$(echo '{"nonce":null,"user_data":null,"public_key":null}' | docker run --rm -i --entrypoint /app/cool-nsm-helper cool-enclave:ci 2>&1)
          code=$?
          echo "$out"
          test $code -ne 0 && echo "$out" | grep -q "/dev/nsm"
      - name: The enclave server module loads from the packed SDK
        run: docker run --rm --entrypoint node cool-enclave:ci -e "import('cool-nwc/nitro').then(m => { if (typeof m.serveEnclave !== 'function') process.exit(1); console.log('ok') })"
